services:
  database:
    image: postgres:16-alpine
    container_name: portal-chamados-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_chamados
      POSTGRES_USER: portal_admin
      POSTGRES_PASSWORD: portal_dev
    ports:
      - "5432:5432"
    volumes:
      - portal_chamados_data:/var/lib/postgresql/data
      - ./server/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_admin -d portal_chamados"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portal-chamados-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      CLIENT_URL: http://localhost:8080
      DATABASE_URL: postgresql://portal_admin:portal_dev@database:5432/portal_chamados
      SESSION_TTL_HOURS: 8
      COOKIE_SECURE: "false"
    ports:
      - "3333:3333"
    volumes:
      - portal_uploads:/app/storage/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3333/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-chamados-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  portal_chamados_data:
  portal_uploads:
